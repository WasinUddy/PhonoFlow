version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      xcode-swift-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /PhonoFlowCore
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      core-swift-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /WebUI
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      web-development-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
